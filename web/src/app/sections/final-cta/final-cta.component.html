<section id="download" class="final-cta section">
  <div class="final-cta__frame">
    <div class="final-cta__burst" aria-hidden="true">
      <img src="assets/images/brand/burst-white.svg" alt="" />
    </div>

    <div class="final-cta__chrome" aria-hidden="true">
      <img src="assets/images/brand/chrome-swirl.png" alt="" />
    </div>

    <div class="container final-cta__inner">
      <div class="final-cta__copy">
        <h2 uReveal>جاهز تعيش تجربة جامعية مختلفة؟</h2>
        <p [uReveal]="0.08">حمّل يونيتوك الحين، وابدأ رحلتك الجامعية من مكان واحد.</p>
      </div>

      <div class="final-cta__store-buttons" [uReveal]="0.16">
        <a
          href="https://apps.apple.com/sa/app/unitok-app/id6745688652"
          target="_blank"
          rel="noopener"
          class="store-badge"
          aria-label="حمّله من App Store"
        >
          <img src="assets/images/brand/app-store-badge.svg" alt="Download on the App Store" />
        </a>
        <a
          href="https://drive.google.com/file/d/1aS0nLPhoBSWqBFmRRJyd7BbpvcnUe723/view?usp=sharing"
          target="_blank"
          rel="noopener"
          class="store-badge"
          aria-label="حمّله من Google Play"
        >
          <img src="assets/images/brand/google-play-badge.svg" alt="Get it on Google Play" />
        </a>
      </div>
    </div>
  </div>
</section>
